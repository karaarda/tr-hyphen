name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v7
        if: matrix.node == 24
        with:
          node-version: 18
      - name: Import the packed package on Node 18
        if: matrix.node == 24
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/tr-hyphen-*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { hyphenate } from 'tr-hyphen';
          assert.equal(hyphenate('Türkçe'), 'Türk-çe');
          JS
